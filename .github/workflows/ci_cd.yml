name: Canada Auto Dispatch System API CI/CD Pipeline

on:
  push:
    branches:
      - Dev-Farazdaq
      - Testing
      - main

jobs:
  # ============================
  # CI JOB
  # ============================
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none

      - name: Prepare .env for CI
        run: |
          cp .env.example .env || true
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=database/database.sqlite" >> .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=ext-grpc

      - name: Generate Laravel app key
        run: php artisan key:generate

      - name: Create SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

  # ============================
  # LIVE DEPLOY (main branch)
  # ============================
  deploy-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Live Server
        run: |
          ssh -o StrictHostKeyChecking=no -p 65002 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -euxo pipefail

          DEPLOY_DIR="/home/u978867526/domains/ahmarinationwideauto.com/public_html/Ahmari_Nationwide/Ahmari_Nationwide_Api_Live"
          REPO_URL="git@github.com:sleekdxb/ahmari-nationwide-api.git"
          BRANCH="main"

          echo "🚀 Deploying LIVE (main)..."

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            echo "📥 First time clone..."
            rm -rf "$DEPLOY_DIR"
            git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
          fi

          cd "$DEPLOY_DIR"

          git remote set-url origin "$REPO_URL"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"


          php artisan config:clear
          php artisan config:cache
          php artisan route:cache

          echo "✅ LIVE Deployment Complete"
          EOF

  # ============================
  # TESTING DEPLOY (Testing-Server branch)
  # ============================
  deploy-testing:
    if: github.ref == 'refs/heads/Testing'
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Testing
        run: |
          ssh -o StrictHostKeyChecking=no -p 65002 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -euxo pipefail

          DEPLOY_DIR="/home/u978867526/domains/ahmarinationwideauto.com/public_html/Ahmari_Nationwide/Ahmari_Nationwide_Api_Testing"
          REPO_URL="git@github.com:sleekdxb/ahmari-nationwide-api.git"
          BRANCH="Testing"

          echo "🚀 Deploying TESTING (Testing-Server)..."

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            echo "📥 First time clone..."
            rm -rf "$DEPLOY_DIR"
            git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
          fi

          cd "$DEPLOY_DIR"

          git remote set-url origin "$REPO_URL"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"



          php artisan config:clear
          php artisan config:cache
          php artisan route:cache

          echo "✅ TESTING Deployment Complete"
          EOF
